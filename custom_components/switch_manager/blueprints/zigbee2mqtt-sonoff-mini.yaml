name: Sonoff Mini (ZBMINIR2/ZBMINIL2)
info: Sonoff Mini smart relay, neutral or no-neutral version.
service: Zigbee2MQTT
event_type: mqtt
mqtt_topic_format: zigbee2mqtt/+/action
buttons:
  - actions:
      - title: toggle
        conditions:
          - key: payload
            value: toggle
      - title: press 2x
        conditions:
          - key: payload
            value: double_click
      - title: hold
        conditions:
          - key: payload
            value: long_press
