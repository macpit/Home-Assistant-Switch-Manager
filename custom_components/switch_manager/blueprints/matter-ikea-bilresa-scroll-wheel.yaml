name: IKEA BILRESA Scroll Wheel (Matter)
service: Matter
event_type: state_changed
identifier_key: device_id
state_domain: event
info: >-
  IKEA BILRESA scroll-wheel remote over Matter. The three LEDs on the lower part
  select one of three targets/modes (pressing the lower part only cycles the LED
  and produces NO Home Assistant event). Per mode the wheel offers the same set of
  gestures, exposed as Matter generic-switch endpoints (event.* entities in HA).


  The three buttons here are the three LEDs (left = LED 1, middle = LED 2, right =
  LED 3). Select a LED, then define its actions: press / press 2x / hold / hold
  release / rotate right / rotate left.


  Set this switch's identifier to the remote's DEVICE - use auto-discovery and
  interact with the remote once, or paste the Home Assistant device id.


  Rotate: just define a single light.turn_on step with a brightness_step_pct
  (e.g. +5 for right, -5 for left) - no templates. Fast scrolling is batched by
  Matter into one event covering several notches; the rotate actions scale your
  brightness_step_pct by the notch count and run it once, so a quick flick dims by
  the full amount in a single smooth call. Tip: set these rotate actions' Mode to
  'queued' so slow scrolling (many small events) isn't dropped either. (Very fast
  turns may still be dropped by Matter below Home Assistant - not recoverable here.)


  Endpoint numbering follows the common BILRESA layout (per LED: rotate right, then
  rotate left, then press). If your unit differs, open the monitor, interact with
  the remote to see which endpoint fires, and adjust the endpoint numbers in the
  conditions below.
buttons:
  # LED 1  (endpoints: rotate right = 1, rotate left = 2, press = 3)
  - x: 124
    y: 336
    width: 10
    conditions: "{{ data.endpoint in ['1','2','3'] }}"
    actions:
      - title: press
        conditions: "{{ data.endpoint == '3' and data.event_type == 'multi_press_1' }}"
      - title: press 2x
        conditions: "{{ data.endpoint == '3' and data.event_type == 'multi_press_2' }}"
      - title: hold
        conditions: "{{ data.endpoint == '3' and data.event_type == 'long_press' }}"
      - title: hold (released)
        conditions: "{{ data.endpoint == '3' and data.event_type == 'long_release' }}"
      - title: rotate right
        conditions: "{{ data.endpoint == '1' }}"
        scale_field: brightness_step_pct
      - title: rotate left
        conditions: "{{ data.endpoint == '2' }}"
        scale_field: brightness_step_pct
  # LED 2  (endpoints: rotate right = 4, rotate left = 5, press = 6)
  - x: 148
    y: 336
    width: 10
    conditions: "{{ data.endpoint in ['4','5','6'] }}"
    actions:
      - title: press
        conditions: "{{ data.endpoint == '6' and data.event_type == 'multi_press_1' }}"
      - title: press 2x
        conditions: "{{ data.endpoint == '6' and data.event_type == 'multi_press_2' }}"
      - title: hold
        conditions: "{{ data.endpoint == '6' and data.event_type == 'long_press' }}"
      - title: hold (released)
        conditions: "{{ data.endpoint == '6' and data.event_type == 'long_release' }}"
      - title: rotate right
        conditions: "{{ data.endpoint == '4' }}"
        scale_field: brightness_step_pct
      - title: rotate left
        conditions: "{{ data.endpoint == '5' }}"
        scale_field: brightness_step_pct
  # LED 3  (endpoints: rotate right = 7, rotate left = 8, press = 9)
  - x: 173
    y: 336
    width: 10
    conditions: "{{ data.endpoint in ['7','8','9'] }}"
    actions:
      - title: press
        conditions: "{{ data.endpoint == '9' and data.event_type == 'multi_press_1' }}"
      - title: press 2x
        conditions: "{{ data.endpoint == '9' and data.event_type == 'multi_press_2' }}"
      - title: hold
        conditions: "{{ data.endpoint == '9' and data.event_type == 'long_press' }}"
      - title: hold (released)
        conditions: "{{ data.endpoint == '9' and data.event_type == 'long_release' }}"
      - title: rotate right
        conditions: "{{ data.endpoint == '7' }}"
        scale_field: brightness_step_pct
      - title: rotate left
        conditions: "{{ data.endpoint == '8' }}"
        scale_field: brightness_step_pct
