name: IKEA BILRESA Scroll Wheel (Matter)
service: Matter
event_type: state_changed
identifier_key: device_id
state_domain: event
info: >-
  IKEA BILRESA scroll-wheel remote over Matter. The lower part of the remote has
  three LEDs that select one of three targets/modes (pressing it only cycles the
  LED and produces NO Home Assistant event). Per mode the wheel offers the same
  three gestures, giving nine Matter generic-switch endpoints. Home Assistant
  exposes each endpoint as a separate event.* entity.


  The buttons are arranged as a control matrix: rows = LED 1/2/3, columns = scroll
  left / press / scroll right. Each cell is one endpoint (EP1..EP9).


  Set this switch's identifier to the remote's DEVICE - use auto-discovery and
  interact with the remote once, or paste the Home Assistant device id.


  Scroll cells fire once per turn with the notch count in
  {{ data.totalNumberOfPressesCounted }} (batched, capped at 8) - use it to scale
  brightness/volume. Also available: {{ data.event_type }}, {{ data.endpoint }},
  {{ data.entity_id }}.


  The endpoint-to-gesture numbering is the common BILRESA layout; if your unit
  differs, open the monitor, interact with the remote to see which endpoint fires,
  and adjust the endpoint values (or match on entity_id instead).
buttons:
  # ---- Row: LED 1 ----
  - x: 520
    y: 120
    width: 110
    height: 170
    conditions:
      - key: endpoint
        value: "2"
    actions: &scroll_actions
      - title: Scroll
  - x: 644
    y: 120
    width: 110
    height: 170
    conditions:
      - key: endpoint
        value: "3"
    actions: &press_actions
      - title: Press
        conditions:
          - key: event_type
            value: multi_press_1
      - title: Hold
        conditions:
          - key: event_type
            value: long_press
      - title: Hold (released)
        conditions:
          - key: event_type
            value: long_release
  - x: 768
    y: 120
    width: 110
    height: 170
    conditions:
      - key: endpoint
        value: "1"
    actions: *scroll_actions
  # ---- Row: LED 2 ----
  - x: 520
    y: 306
    width: 110
    height: 170
    conditions:
      - key: endpoint
        value: "5"
    actions: *scroll_actions
  - x: 644
    y: 306
    width: 110
    height: 170
    conditions:
      - key: endpoint
        value: "6"
    actions: *press_actions
  - x: 768
    y: 306
    width: 110
    height: 170
    conditions:
      - key: endpoint
        value: "4"
    actions: *scroll_actions
  # ---- Row: LED 3 ----
  - x: 520
    y: 492
    width: 110
    height: 170
    conditions:
      - key: endpoint
        value: "8"
    actions: *scroll_actions
  - x: 644
    y: 492
    width: 110
    height: 170
    conditions:
      - key: endpoint
        value: "9"
    actions: *press_actions
  - x: 768
    y: 492
    width: 110
    height: 170
    conditions:
      - key: endpoint
        value: "7"
    actions: *scroll_actions
