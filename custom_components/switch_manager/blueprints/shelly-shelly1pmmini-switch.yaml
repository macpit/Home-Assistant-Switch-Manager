name: Shelly 1 mini / 1pm mini Gen3 (switch)
info: Also covers the Shelly 1 Mini Gen3, which sends the same events as the 1PM Mini -
  the only difference between the two is the power meter.
service: Shelly
event_type: state_changed
identifier_key: entity_id
conditions: "{{ (data.old_state.state == 'off' and data.new_state.state == 'on') or (data.old_state.state == 'on' and data.new_state.state == 'off')}}"
buttons:
  - actions:
      - title: init
      - title: 'on'
        conditions: 
          - key: new_state.state
            value: 'on'
      - title: 'off'
        conditions: 
          - key: new_state.state
            value: 'off'
