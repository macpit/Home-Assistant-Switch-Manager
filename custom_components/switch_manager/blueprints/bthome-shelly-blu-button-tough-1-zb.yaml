name: Shelly BLU Button Tough 1 ZB
service: BTHome
event_type: bthome_ble_event
identifier_key: device_id
conditions:
  - key: event_class
    value: button
buttons:
  - actions:
      - title: press
        conditions:
          - key: event_type
            value: press
      - title: press 2x
        conditions:
          - key: event_type
            value: double_press
      - title: press 3x
        conditions:
          - key: event_type
            value: triple_press
      - title: hold
        conditions:
          - key: event_type
            value: hold_press
      - title: hold (released)
        conditions:
          - key: event_type
            value: long_press
      - title: press 2x (hold released)
        conditions:
          - key: event_type
            value: long_double_press
      - title: press 3x (hold released)
        conditions:
          - key: event_type
            value: long_triple_press
