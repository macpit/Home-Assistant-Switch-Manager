name: Homematic 2 Buttons
service: Homematic
event_type: homematic.keypress
identifier_key: device_id
info: >-
  Hold matches press_long_start on Homematic IP devices and press_long on classic
  BidCos-RF devices (HM-...), which never send press_long_start.
buttons:
  - x: 85
    y: 85
    width: 330
    height: 164
    conditions:
      - key: subtype
        value: 2
    actions:
      - title: press
        conditions:
          - key: type
            value: press_short
      - title: hold
        conditions: "{{ data.type == 'press_long_start' or (data.type == 'press_long' and 'HmIP' not in (data.model | default(data.device_type) | default('') | string)) }}"
  - x: 85
    y: 252
    width: 330
    height: 164
    conditions:
      - key: subtype
        value: 1
    actions:
      - title: press
        conditions:
          - key: type
            value: press_short
      - title: hold
        conditions: "{{ data.type == 'press_long_start' or (data.type == 'press_long' and 'HmIP' not in (data.model | default(data.device_type) | default('') | string)) }}"
