name: LinknLink eMotion Air Plus
service: Zigbee2MQTT
event_type: mqtt
mqtt_topic_format: zigbee2mqtt/+
buttons:
  - actions:
      - title: press
        conditions:
          - key: 'action'
            value: 'toggle'
      - title: press 2x
        conditions:
          - key: 'action'
            value: 'on'
      - title: press 3x
        conditions:
          - key: 'action'
            value: 'off'
      - title: hold
        conditions:
          - key: 'action'
            value: 'brightness_move_up'
      - title: hold (released)
        conditions:
          - key: 'action'
            value: 'brightness_stop'
