name: Homematic 2 Buttons (Event Entity)
service: Homematic
event_type: event_entity
identifier_key: device_id
info: >-
  Uses the event.* entities that Homematic(IP) Local creates for each button channel
  instead of the homematic.keypress bus event, so it keeps working when the bus events
  do not arrive (see issue #72). Identifier is the Home Assistant device id of the remote.
  Channel 1 (bottom) is entity_index 0, channel 2 (top) is entity_index 1. Hold matches
  press_long_start (Homematic IP); classic BidCos-RF devices (HM-...) only send press_long,
  use the "Homematic 2 Buttons" bus event blueprint for those.
buttons:
  - x: 85
    y: 85
    width: 330
    height: 164
    conditions:
      - key: entity_index
        value: 1
    actions:
      - title: press
        conditions:
          - key: event_type
            value: press_short
      - title: hold
        conditions:
          - key: event_type
            value: press_long_start
  - x: 85
    y: 252
    width: 330
    height: 164
    conditions:
      - key: entity_index
        value: 0
    actions:
      - title: press
        conditions:
          - key: event_type
            value: press_short
      - title: hold
        conditions:
          - key: event_type
            value: press_long_start
