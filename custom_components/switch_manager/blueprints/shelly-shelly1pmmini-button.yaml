name: Shelly 1 mini / 1pm mini Gen3 (button)
info: Also covers the Shelly 1 Mini Gen3, which sends the same events as the 1PM Mini -
  the only difference between the two is the power meter.
service: Shelly
event_type: shelly.click
identifier_key: device_id
buttons:
  - actions:
      - title: press
        conditions:
          - key: click_type
            value: single_push
      - title: press 2x
        conditions:
          - key: click_type
            value: double_push
      - title: press 3x
        conditions:
          - key: click_type
            value: triple_push
      - title: hold
        conditions:
          - key: click_type
            value: long_push
      - title: released
        conditions:
          - key: click_type
            value: btn_up
