name: Homematic IP Key Ring Remote 4 Buttons (HmIP-KRC4) (Event Entity)
service: Homematic
event_type: event_entity
identifier_key: device_id
info: >-
  Uses the event.* entities that Homematic(IP) Local creates for each button channel
  instead of the homematic.keypress bus event, so it keeps working when the bus events
  do not arrive (see issue #72). Identifier is the Home Assistant device id of the remote.
  With the LED at the top and the key ring at the bottom, the buttons are channels
  2, 1, 4, 3 (entity_index 1, 0, 3, 2) from top to bottom.
buttons:
  - d: "M255,96 Q300,66 355,57 L357,137 L278,137 Z"
    conditions:
      - key: entity_index
        value: 2
    actions:
      - title: press
        conditions:
          - key: event_type
            value: press_short
      - title: hold
        conditions:
          - key: event_type
            value: press_long_start
      - title: hold (released)
        conditions:
          - key: event_type
            value: press_long_release
  - x: 371
    y: 52
    width: 75
    height: 86
    conditions:
      - key: entity_index
        value: 3
    actions:
      - title: press
        conditions:
          - key: event_type
            value: press_short
      - title: hold
        conditions:
          - key: event_type
            value: press_long_start
      - title: hold (released)
        conditions:
          - key: event_type
            value: press_long_release
  - x: 458
    y: 52
    width: 77
    height: 86
    conditions:
      - key: entity_index
        value: 0
    actions:
      - title: press
        conditions:
          - key: event_type
            value: press_short
      - title: hold
        conditions:
          - key: event_type
            value: press_long_start
      - title: hold (released)
        conditions:
          - key: event_type
            value: press_long_release
  - d: "M548,57 Q602,66 647,96 L618,137 L547,137 Z"
    conditions:
      - key: entity_index
        value: 1
    actions:
      - title: press
        conditions:
          - key: event_type
            value: press_short
      - title: hold
        conditions:
          - key: event_type
            value: press_long_start
      - title: hold (released)
        conditions:
          - key: event_type
            value: press_long_release
