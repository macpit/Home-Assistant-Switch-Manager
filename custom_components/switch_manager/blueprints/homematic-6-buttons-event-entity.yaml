name: Homematic 6 Buttons (Event Entity)
service: Homematic
event_type: event_entity
identifier_key: device_id
info: >-
  Uses the event.* entities that Homematic(IP) Local creates for each button channel
  instead of the homematic.keypress bus event, so it keeps working when the bus events
  do not arrive (see issue #72). Identifier is the Home Assistant device id of the remote.
  Channel 1 is entity_index 0 (top left), channels count row by row. Hold matches
  press_long_start (Homematic IP); classic BidCos-RF devices (HM-...) only send press_long,
  use the "Homematic 6 Buttons" bus event blueprint for those.
buttons:
  - x: 85
    y: 85
    width: 96
    height: 109
    conditions:
      - key: entity_index
        value: 0
    actions:
      - title: press
        conditions:
          - key: event_type
            value: press_short
      - title: hold
        conditions:
          - key: event_type
            value: press_long_start
  - x: 319
    y: 85
    width: 96
    height: 109
    conditions:
