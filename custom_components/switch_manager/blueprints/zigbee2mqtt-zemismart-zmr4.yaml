name: Zemismart 4 Button Scene (ZMR4)
service: Zigbee2MQTT
event_type: mqtt
mqtt_topic_format: zigbee2mqtt/+/action
buttons:
  ## Buttons top to bottom send 1~4
  - x: 63
    y: 55
    width: 157
    height: 84
    actions:
      - title: press
        conditions:
          - key: payload
            value: 1_single
      - title: press 2x
        conditions:
          - key: payload
            value: 1_double
      - title: hold
        conditions:
          - key: payload
            value: 1_hold
  - x: 63
    y: 140
    width: 157
    height: 84
    actions:
      - title: press
        conditions:
          - key: payload
            value: 2_single
      - title: press 2x
        conditions:
          - key: payload
            value: 2_double
      - title: hold
        conditions:
          - key: payload
            value: 2_hold
  - x: 63
    y: 225
    width: 157
    height: 83
    actions:
      - title: press
        conditions:
          - key: payload
            value: 3_single
      - title: press 2x
        conditions:
          - key: payload
            value: 3_double
      - title: hold
        conditions:
          - key: payload
            value: 3_hold
  - x: 63
    y: 309
    width: 157
    height: 84
    actions:
      - title: press
        conditions:
          - key: payload
            value: 4_single
      - title: press 2x
        conditions:
          - key: payload
            value: 4_double
      - title: hold
        conditions:
          - key: payload
            value: 4_hold
